# docker-compose.yml

# Uso: docker-compose up --build

# Requiere Docker Desktop instalado en la PC

version: '3.9'

services:

# ── Base de datos PostgreSQL ────────────────────────────────────────

db:

image: postgres:15-alpine

restart: unless-stopped

environment:

  POSTGRES\_DB:       erp\_db

  POSTGRES\_USER:     erp\_user

  POSTGRES\_PASSWORD: erp\_pass\_local

volumes:

  \- postgres\_data:/var/lib/postgresql/data

ports:

  \- "5432:5432"

healthcheck:

  test: \["CMD-SHELL", "pg\_isready \-U erp\_user \-d erp\_db"\]

  interval: 5s

  timeout: 5s

  retries: 5
# ── Cache Redis (preparado para Celery en W16) ─────────────────────

redis:

image: redis:7-alpine

restart: unless-stopped

ports:

  \- "6379:6379"
# ── Aplicación Django ───────────────────────────────────────────────

web:

build: .

restart: unless-stopped

command: \>

  sh \-c "python manage.py migrate &&

         python manage.py collectstatic \--no-input &&

         gunicorn core.wsgi \--bind 0.0.0.0:8000 \--workers 2 \--log-file \-"

volumes:

  \- .:/app

  \- static\_volume:/app/staticfiles

  \- media\_volume:/app/media

ports:

  \- "8000:8000"

depends\_on:

  db:

    condition: service\_healthy

environment:

  DJANGO\_SETTINGS\_MODULE: core.settings\_prod

  SECRET\_KEY:             dev-clave-docker-no-usar-en-produccion

  DEBUG:                  "False"

  DATABASE\_URL:           postgres://erp\_user:erp\_pass\_local@db:5432/erp\_db

  REDIS\_URL:              redis://redis:6379/0

  ALLOWED\_HOSTS:          localhost,127.0.0.1
volumes:

postgres_data:

static_volume:

media_volume: